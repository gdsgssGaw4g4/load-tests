name: warptest
on:
  workflow_dispatch:
jobs:
  w:
    runs-on: ubuntu-latest
    steps:
      - name: warp up
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard
          sudo apt-get install -y resolvconf || true
          sudo modprobe wireguard || true
          TAG=$(curl -s https://api.github.com/repos/ViRb3/wgcf/releases/latest | jq -r .tag_name)
          V=${TAG#v}
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/$TAG/wgcf_${V}_linux_amd64
          chmod +x wgcf
          ./wgcf register --accept-tos
          ./wgcf generate
          grep -v -e '^DNS' wgcf-profile.conf | sudo tee /etc/wireguard/wgcf.conf > /dev/null
          sudo wg-quick up wgcf || true
          sudo wg show | head -20
      - name: probe egress + velor
        run: |
          echo "== wg =="; sudo wg show wgcf | head -6
          echo "== default route =="; ip route show default | head -2; ip -6 route show default 2>/dev/null | head -2
          echo "== cf trace =="; curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^ip=|^warp=|^colo=|^loc=' || echo trace-fail
          for i in 1 2 3; do
            c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 https://velor.win/api/health)
            b=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o /dev/null -w "%{http_code}" --max-time 12 https://velor.win/api/health)
            t=$(curl -s --max-time 12 https://velor.win/api/health | grep -o '<title>[^<]*' | head -1)
            echo "try$i code=$c chromeUA=$b title=$t"
            sleep 2
          done
